version: "3.9"

name: netskope-stack   # nombre del proyecto docker compose

networks:
  stack:
    driver: bridge

volumes:
  frontend_node_modules: {}   # evita problemas al bindear el código en dev

services:
  # =========================
  # Backend (DEV)
  # =========================
  api:
    build:
      context: ./backend
      target: dev                     # imagen de desarrollo (uvicorn --reload)
    env_file:
      - ./backend/.env.dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app                # hot-reload en dev
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    profiles: ["dev"]
    networks: ["stack"]

  # =========================
  # Backend (PROD)
  # =========================
  api-prod:
    build:
      context: ./backend
      target: prod                    # gunicorn + uvicorn worker
    env_file:
      - ./backend/.env.prod
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    profiles: ["prod"]
    networks: ["stack"]

  # =========================
  # Frontend (DEV - Vite)
  # =========================
  web:
    build:
      context: ./frontend
      target: dev                     # npm run dev
    environment:
      - VITE_API_BASE_URL=http://localhost:8000  # el navegador llama al host
      - CHOKIDAR_USEPOLLING=true                 # mejor watch en Docker/WSL
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules  # mantiene node_modules
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173"]
      interval: 10s
      timeout: 3s
      retries: 10
    profiles: ["dev"]
    networks: ["stack"]

  # =========================
  # Frontend (PROD - NGINX)
  # =========================
  web-prod:
    build:
      context: ./frontend
      target: prod
      args:
        # Se embebe en el bundle de React; visible para el navegador
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - api-prod
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    profiles: ["prod"]
    networks: ["stack"]