services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: netskope_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./apiNetskopeBackend
      dockerfile: Dockerfile.dev
    env_file:
      - ./apiNetskopeBackend/.env.dev      # <-- usas tu .env.dev
    volumes:
      - ./apiNetskopeBackend/app:/app/app  # hot-reload del código
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: >
      uvicorn app.main:app
      --host ${BACKEND_HOST:-0.0.0.0}
      --port ${BACKEND_PORT:-8001}
      --proxy-headers
      --forwarded-allow-ips='*'

  frontend:
    build:
      context: ./apiNetskopeFrontend
      dockerfile: Dockerfile.dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apiNetskopeFrontend/src:/app/src
      # Vite no carga .env.dev por defecto en 'dev', así que lo montamos como /app/.env:
      - ./apiNetskopeFrontend/.env.dev:/app/.env:ro
    ports:
      - "3005:3005"
    depends_on:
      - backend
    restart: unless-stopped
    command: >
      npm run dev -- --host 0.0.0.0 --port 3005

volumes:
  pgdata: