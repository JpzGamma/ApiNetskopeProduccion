name: CI - Dev

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/apiNetskopeBackend
    defaults:
      run:
        working-directory: apiNetskopeBackend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apiNetskopeBackend/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt