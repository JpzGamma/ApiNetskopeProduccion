name: CI - Dev

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apiNetskopeBackend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apiNetskopeBackend/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -q

  build-images:
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (dev)
        run: docker build -f apiNetskopeBackend/Dockerfile.dev -t myorg/api-netskope-backend:dev apiNetskopeBackend

      - name: Build frontend image (dev)
        run: docker build -f apiNetskopeFrontend/Dockerfile.dev -t myorg/api-netskope-frontend:dev apiNetskopeFrontend

      # Opcional: push si configuraste el login arriba
      # - name: Push images
      #   run: |
      #     docker push myorg/api-netskope-backend:dev
      #     docker push myorg/api-netskope-frontend:dev