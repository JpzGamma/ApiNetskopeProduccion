name: CI - Dev

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with: python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r apiNetskopeBackend/requirements.txt
      - name: Run tests
        run: |
          pytest -q

  build-images (optional):
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Opcional: login to registry (DOCKERHUB/GHCR) using secrets
      # - name: Login to DockerHub
      #   uses: docker/login-action@v2
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build backend image
        run: |
          docker build -f apiNetskopeBackend/Dockerfile.dev -t myorg/api-netskope-backend:dev apiNetskopeBackend
      - name: Build frontend image
        run: |
          docker build -f apiNetskopeFrontend/Dockerfile.dev -t myorg/api-netskope-frontend:dev apiNetskopeFrontend
      # push steps if registry configured...