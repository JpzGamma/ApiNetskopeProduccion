name: CI - Prod

on:
  push:
    branches: ["main"]

jobs:
  tests-and-build:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/apiNetskopeBackend
    defaults:
      run:
        working-directory: apiNetskopeBackend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apiNetskopeBackend/requirements.txt

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run backend tests
        run: pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend prod image
        run: docker build -f apiNetskopeBackend/Dockerfile.prod -t myorg/api-netskope-backend:latest apiNetskopeBackend

      - name: Build frontend prod image
        run: docker build -f apiNetskopeFrontend/Dockerfile.prod -t myorg/api-netskope-frontend:latest apiNetskopeFrontend