name: CI - Prod

on:
  push:
    branches: [ "main" ]

jobs:
  tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with: python-version: '3.11'
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r apiNetskopeBackend/requirements.txt
      - name: Run backend tests
        run: pytest -q

      - name: Build backend prod image
        run: docker build -f apiNetskopeBackend/Dockerfile.prod -t myorg/api-netskope-backend:latest apiNetskopeBackend

      - name: Build frontend prod image
        run: docker build -f apiNetskopeFrontend/Dockerfile.prod -t myorg/api-netskope-frontend:latest apiNetskopeFrontend

